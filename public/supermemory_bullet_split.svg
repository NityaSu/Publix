<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Supermemory logo: 6 strokes, split at center -->
  <g stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 3 strokes pointing UP from center -->
    <!-- Top vertical -->
    <line x1="12" y1="12" x2="12" y2="3" />
    <!-- Upper-left diagonal -->
    <line x1="12" y1="12" x2="3" y2="5" />
    <!-- Upper-right diagonal -->
    <line x1="12" y1="12" x2="21" y2="5" />

    <!-- 3 strokes pointing DOWN from center -->
    <!-- Bottom vertical -->
    <line x1="12" y1="12" x2="12" y2="21" />
    <!-- Lower-left diagonal -->
    <line x1="12" y1="12" x2="3" y2="19" />
    <!-- Lower-right diagonal -->
    <line x1="12" y1="12" x2="21" y2="19" />
  </g>
</svg>